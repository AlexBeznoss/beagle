require:
  - standard

plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-capybara
  - rubocop-factory_bot

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable

inherit_gem:
  standard: config/base.yml

Rails/Output:
  Exclude:
    - 'app/views/**/*.rb'

# Keep the explicit FactoryBot namespace used throughout this suite.
FactoryBot/SyntaxMethods:
  Enabled: false
